name: Automated Gemini Log Generator

on:
  schedule:
    - cron: '0 0 * * *'  # Runs automatically every night at midnight UTC
  workflow_dispatch:      # Adds a manual trigger button in your GitHub UI

jobs:
  run-gemini:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install google-genai

      - name: Run Gemini generator script
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python generate_snapshot.py

      - name: Save and push Markdown log back to repository
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add logs/
          git diff --quiet && git diff --staged --quiet || (git commit -m "Automated Gemini snapshot commit" && git push)
